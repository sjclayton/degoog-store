<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="sjclayton's degoog store">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1e2e"/>
      <stop offset="0.55" stop-color="#181825"/>
      <stop offset="1" stop-color="#11111b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#89b4fa" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#cba6f7" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#cba6f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b4befe" stop-opacity="0.5"/>
      <stop offset="0.6" stop-color="#cba6f7" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#f5c2e7" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b4befe"/>
      <stop offset="1" stop-color="#89b4fa"/>
    </linearGradient>
    <linearGradient id="mauve" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5c2e7"/>
      <stop offset="1" stop-color="#cba6f7"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a6e3a1"/>
      <stop offset="1" stop-color="#94e2d5"/>
    </linearGradient>
    <linearGradient id="peach" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9e2af"/>
      <stop offset="1" stop-color="#fab387"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <rect x="11" y="11" width="490" height="490" rx="102" fill="none" stroke="url(#rim)" stroke-width="5"/>

  <g>
    <rect x="84" y="84" width="150" height="150" rx="40" fill="url(#blue)"/>
    <rect x="278" y="84" width="150" height="150" rx="40" fill="url(#mauve)"/>
    <rect x="84" y="278" width="150" height="150" rx="40" fill="url(#green)"/>
    <rect x="278" y="278" width="150" height="150" rx="40" fill="url(#peach)"/>
  </g>

  <g fill="#ffffff" opacity="0.10">
    <rect x="98" y="98" width="122" height="20" rx="10"/>
    <rect x="292" y="98" width="122" height="20" rx="10"/>
    <rect x="98" y="292" width="122" height="20" rx="10"/>
    <rect x="292" y="292" width="122" height="20" rx="10"/>
  </g>
</svg>
